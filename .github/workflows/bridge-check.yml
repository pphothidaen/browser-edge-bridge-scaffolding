name: Bridge Checks
on: [pull_request]

jobs:
  no-hardcoded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for hardcoded secrets in diff
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            DIFF=$(git diff origin/main...HEAD)
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF=$(git diff HEAD~1 HEAD)
          else
            echo "::error::unable to determine a commit diff for the secret scan" >&2
            exit 1
          fi
          if echo "$DIFF" | grep -v "bridge-check.yml" | grep -qE '(token-literal-example)'; then
            echo "::error::hard-coded token literal found in diff"; exit 1
          fi
          echo "no-hardcoded-secrets: PASS"
